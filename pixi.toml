[workspace]
authors = ["Janek <jan.malasnicki@gmail.com>"]
channels = ["conda-forge"]
name = "basic_ml"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
install_hooks = "git config --local core.hooksPath .githooks"

[dependencies]
python = "==3.12.3"

[pypi-dependencies]
transformers = "==4.55.0"
datasets = "==3.1.0"
fabric = "==3.2.2"
pydantic = "==2.10.4"
torchdata = "==0.11.0"
black = "==25.1.0"
torchao = "==0.11.0"
torchtune = "==0.6.1"
lm-eval = ">=0.4.0"
jupyter = "*"
ipykernel = "*"
matplotlib = "*"
torch = "==2.6.0"
torchvision = "==0.21.0"
bitsandbytes = "*"
accelerate = "*"